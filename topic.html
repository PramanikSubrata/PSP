<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Topic · Problem Solving with Programming (PSP)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:#16132e; --muted:#6a6a86; --bg:#f8f8fd; --card:#fff; --line:#e8e6f4;
    --brand:#6d28d9; --brand-2:#06b6d4;
    --notes:#2563eb; --notes-bg:#eff5ff;
    --videos:#db2777; --videos-bg:#fdf0f7;
    --code:#059669; --code-bg:#ecfaf4;
    --assign:#d97706; --assign-bg:#fff6ea;
    --radius:16px; --shadow:0 10px 30px -12px rgba(45,27,105,.18);
    --font-display:"Space Grotesk",sans-serif; --font-body:"Inter",sans-serif; --font-mono:"JetBrains Mono",monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body { font-family:var(--font-body); color:var(--ink); background:var(--bg); line-height:1.6; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 22px; }

  .nav { position:sticky; top:0; z-index:50; background:rgba(248,248,253,.85); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  .nav-inner { display:flex; align-items:center; justify-content:space-between; height:62px; }
  .brand-mark { display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:18px; }
  .brand-badge { width:34px; height:34px; border-radius:9px; display:grid; place-items:center; background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; font-family:var(--font-mono); font-weight:600; font-size:15px; box-shadow:0 6px 16px -6px rgba(109,40,217,.6); }
  .brand-word { font-family:var(--font-display); font-weight:700; letter-spacing:.06em; background:linear-gradient(100deg,var(--brand),var(--brand-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .back-link { display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:14px; color:var(--brand); padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:#fff; transition:.18s; }
  .back-link:hover { background:#f0ecfe; transform:translateX(-2px); }

  .topic-hero { background:radial-gradient(700px 300px at 90% -20%, rgba(109,40,217,.28), transparent 60%), #12102c; color:#fff; padding:46px 0 52px; }
  .crumb { font-family:var(--font-mono); font-size:12.5px; color:#c9b8ff; letter-spacing:.04em; }
  .topic-hero h1 { font-family:var(--font-display); font-weight:700; font-size:clamp(28px,4.5vw,42px); letter-spacing:-.02em; margin-top:14px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .big-num { width:54px; height:54px; border-radius:14px; display:grid; place-items:center; font-size:24px; background:linear-gradient(135deg,var(--brand),var(--brand-2)); flex:none; }
  .topic-unit { display:inline-block; margin-top:14px; font-family:var(--font-mono); font-size:13px; color:#cfcbe8; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); padding:6px 13px; border-radius:999px; }

  main { padding:40px 0 70px; }

  /* Two-column layout */
  .layout { display:grid; gap:22px; align-items:start; }
  .layout.has-desc { grid-template-columns:1.5fr 1fr; }
  .layout.no-desc  { grid-template-columns:1fr; }
  @media (max-width:900px){ .layout.has-desc { grid-template-columns:1fr; } }

  .col-res { display:flex; flex-direction:column; gap:16px; }
  .no-desc .col-res { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:640px){ .no-desc .col-res { grid-template-columns:1fr; } }

  /* Resource cards */
  .res { border:1px solid var(--line); border-radius:13px; padding:16px 17px; background:#fff; box-shadow:0 4px 16px -12px rgba(45,27,105,.2); }
  .res-head { display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-weight:600; font-size:15px; margin-bottom:13px; }
  .res-ic { width:28px; height:28px; border-radius:8px; display:grid; place-items:center; flex:none; }
  .res.notes { border-top:3px solid var(--notes); } .res.notes .res-ic { background:var(--notes-bg); }
  .res.videos { border-top:3px solid var(--videos); } .res.videos .res-ic { background:var(--videos-bg); }
  .res.code { border-top:3px solid var(--code); } .res.code .res-ic { background:var(--code-bg); }
  .res.assign { border-top:3px solid var(--assign); } .res.assign .res-ic { background:var(--assign-bg); }
  .res.tutorial { border-top:3px solid #0d9488; } .res.tutorial .res-ic { background:#e6faf5; }

  .link-row { display:flex; align-items:center; gap:9px; padding:10px 12px; border-radius:9px; font-size:14px; font-weight:500; transition:.15s; margin-bottom:7px; background:#faf9ff; border:1px solid transparent; }
  .link-row:last-child { margin-bottom:0; }
  .link-row .lbl { flex:1; }
  .link-row .arw { color:var(--muted); font-size:12px; }
  .link-row.notes:hover { background:var(--notes-bg); border-color:#d7e6ff; transform:translateX(3px); }
  .link-row.videos:hover { background:var(--videos-bg); border-color:#f7d6e8; transform:translateX(3px); }
  .link-row.assign:hover { background:var(--assign-bg); border-color:#fde3c0; transform:translateX(3px); }
  .link-row.tutorial:hover { background:#e6faf5; border-color:#bdeee2; transform:translateX(3px); }
  .empty { color:var(--muted); font-size:13.5px; font-style:italic; padding:6px 2px; }

  .code-links a { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 13px; border-radius:10px; margin-bottom:8px; font-weight:600; font-size:14px; color:#065f46; background:var(--code-bg); border:1px solid #cdeee0; transition:.15s; }
  .code-links a:last-child { margin-bottom:0; }
  .code-links a:hover { background:#059669; color:#fff; }
  .code-links a .tag { font-family:var(--font-mono); font-size:11px; font-weight:500; opacity:.8; }

  .assign-box { display:flex; flex-direction:column; gap:12px; }
  .deadline { display:inline-flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:13px; color:#92400e; background:var(--assign-bg); padding:8px 12px; border-radius:9px; border:1px solid #fde3c0; width:fit-content; }
  .assign-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--assign); color:#fff; font-weight:600; font-size:14px; padding:11px 16px; border-radius:10px; transition:.15s; }
  .assign-btn:hover { background:#b45309; }

  /* Description card (left) */
  .desc-card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px 26px; box-shadow:0 4px 16px -12px rgba(45,27,105,.2); border-top:3px solid var(--brand); }
  .desc-head { display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-weight:600; font-size:15px; margin-bottom:14px; color:var(--brand); }
  .desc-head .res-ic { background:#f0ecfe; }
  .desc-body { font-size:15px; color:#2f2c48; line-height:1.75; }
  .desc-body h1,.desc-body h2,.desc-body h3,.desc-body h4 { font-family:var(--font-display); color:var(--ink); margin:20px 0 8px; line-height:1.3; }
  .desc-body h1{ font-size:23px; } .desc-body h2{ font-size:20px; } .desc-body h3{ font-size:17px; } .desc-body h4{ font-size:15px; }
  .desc-body p { margin:11px 0; }
  .desc-body ul,.desc-body ol { margin:11px 0 11px 22px; }
  .desc-body li { margin:6px 0; }
  .desc-body a { color:var(--brand); text-decoration:underline; }
  .desc-body strong { color:var(--ink); }
  .desc-body code { font-family:var(--font-mono); font-size:13px; background:#f2effa; color:#6d28d9; padding:2px 6px; border-radius:5px; }
  .desc-body pre { background:#0c0a1f; border:1px solid #1e1b3a; border-radius:12px; padding:16px 18px; overflow-x:auto; margin:14px 0; }
  .desc-body pre code { background:none; color:#e6e6f0; padding:0; font-size:13px; line-height:1.75; display:block; }
  .desc-body blockquote { border-left:3px solid var(--brand); background:#f7f5ff; padding:8px 14px; margin:12px 0; border-radius:0 8px 8px 0; color:#463f66; }
  .desc-body img { max-width:100%; border-radius:8px; }
  .desc-body table { border-collapse:collapse; margin:12px 0; width:100%; }
  .desc-body th,.desc-body td { border:1px solid var(--line); padding:8px 10px; font-size:14px; text-align:left; }
  .desc-body hr { border:none; border-top:1px solid var(--line); margin:16px 0; }

  .chapters-card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px; box-shadow:0 4px 16px -12px rgba(45,27,105,.2); border-top:3px solid var(--brand); margin-bottom:22px; }
  .chapter-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media (max-width:640px){ .chapter-grid { grid-template-columns:1fr; } }
  .chapter-row { display:flex; align-items:center; gap:9px; padding:12px 14px; border-radius:10px; font-size:14.5px; font-weight:600; color:var(--ink); background:#f7f5ff; border:1px solid #ece7fb; transition:.15s; }
  .chapter-row:hover { background:#efe9fe; border-color:#d9d2f7; transform:translateX(3px); }
  .chapter-row .lbl { flex:1; }
  .chapter-row .arw { color:var(--brand); }

  .state { text-align:center; padding:60px 20px; color:var(--muted); }
  .state h2 { font-family:var(--font-display); color:var(--ink); margin-bottom:8px; }

  footer { background:#12102c; color:#cfcbe8; padding:40px 0; text-align:center; }
  footer .fnote { font-family:var(--font-mono); font-size:13px; color:#8a86ad; margin-top:8px; }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;scroll-behavior:auto;} }
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap nav-inner">
    <a class="brand-mark" href="index.html"><span class="brand-badge">&lt;/&gt;</span> <span class="brand-word">PSP</span></a>
    <a class="back-link" href="index.html#topics">← All Topics</a>
  </div>
</nav>

<header class="topic-hero">
  <div class="wrap">
    <div class="crumb" id="crumb">// PSP · Topic</div>
    <h1><span class="big-num" id="big-num">–</span><span id="topic-name">Loading…</span></h1>
    <span class="topic-unit" id="topic-unit"></span>
  </div>
</header>

<main>
  <div class="wrap" id="content">
    <div class="state"><h2>Loading topic…</h2><p>Please wait a moment.</p></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div style="font-family:var(--font-display);font-weight:600;font-size:16px;">Problem Solving with Programming (PSP)</div>
    <div class="fnote">Maintained by Teaching Assistant Team (IIITA)</div>
  </div>
</footer>

<!-- Markdown renderer for the Description -->
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
// 5 compilers — same for every topic
const COMPILERS = [
  { label: "OnlineGDB",     url: "https://www.onlinegdb.com/online_c_compiler", tag: "Write & run instantly" },
  { label: "CodeChef",      url: "https://www.codechef.com/practice/c",         tag: "Practice ladder" },
  { label: "HackerRank",    url: "https://www.hackerrank.com/domains/c",        tag: "Structured problems" },
  { label: "VS Code (Web)", url: "https://visual-studio-code-three.vercel.app/", tag: "Full editor in browser" },
  { label: "LeetCode (C)",  url: "https://leetcode.com/problemset/?search=c",    tag: "Interview-style problems" }
];

const IC = {
  desc:   '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  notes:  '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h6"/></svg>',
  videos: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#db2777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="10 8 16 12 10 16 10 8"/><rect x="2" y="4" width="20" height="16" rx="3"/></svg>',
  code:   '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>',
  assign: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  clock:  '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#92400e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  book:   '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  tutorial:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1 2.5 2 6 2s6-1 6-2v-5"/></svg>'
};

// Read ?t=N  (N can be a number like 1, or a sub-file id like 1-1)
const params = new URLSearchParams(location.search);
let n = (params.get("t") || "1").trim();
if (!/^[A-Za-z0-9._-]+$/.test(n)) n = "1";

// Parse a topic subfile (title, unit, description, notes, videos, assignment)
function parseTopic(md) {
  const lines = md.split(/\r?\n/);
  let name = "", unit = "", mode = null, inCode = false, inComment = false;
  const notes = [], videos = [], descLines = [], assignment = [], chapters = [], tutorials = [];
  const isBoundary = (h) => {
    const t = h.trim().toLowerCase();
    return t.startsWith("note") || t.startsWith("video") || t.startsWith("lecture") || t.startsWith("tutorial") || t.startsWith("assign") || t.startsWith("chapter");
  };
  for (const raw of lines) {
    const trimmed = raw.trim();

    // Code fences first (so any comment-like text inside code is preserved)
    if (trimmed.startsWith("```")) {
      if (mode === "description") descLines.push(raw);
      inCode = !inCode; continue;
    }
    if (inCode) { if (mode === "description") descLines.push(raw); continue; }

    // HTML comments are ignored everywhere (they are just editor guidance)
    if (trimmed.startsWith("<!--")) inComment = true;
    if (inComment) { if (trimmed.includes("-->")) inComment = false; continue; }

    // Title
    if (trimmed.startsWith("# ") && !name) { name = trimmed.slice(2).trim(); continue; }

    // Section headers
    if (trimmed.startsWith("## ")) {
      const h = trimmed.slice(3).trim(), hl = h.toLowerCase();
      if (hl.startsWith("description")) { mode = "description"; continue; }
      if (isBoundary(h)) {
        mode = hl.startsWith("note") ? "notes"
             : hl.startsWith("assign") ? "assignment"
             : hl.startsWith("chapter") ? "chapters"
             : hl.startsWith("tutorial") ? "tutorials"
             : (hl.startsWith("video") || hl.startsWith("lecture")) ? "videos"
             : "videos";
        continue;
      }
      if (mode === "description") { descLines.push(raw); continue; }
      continue;
    }

    // List items in structured sections
    if (trimmed.startsWith("- ") && (mode === "notes" || mode === "videos" || mode === "assignment" || mode === "chapters" || mode === "tutorials")) {
      const item = trimmed.slice(2);
      const i = item.lastIndexOf("|");
      const label = (i >= 0 ? item.slice(0, i) : item).trim();
      let url = (i >= 0 ? item.slice(i + 1) : "#").trim();
      url = url.replace(/^["'`]+|["'`]+$/g, "").trim() || "#";
      if (mode === "assignment") assignment.push({ label: label || "TBA", url });
      else if (mode === "chapters") chapters.push({ label: label || url, id: url });
      else if (mode === "tutorials") tutorials.push({ label, url });
      else (mode === "notes" ? notes : videos).push({ label, url });
      continue;
    }

    // Description body
    if (mode === "description") { descLines.push(raw); continue; }

    // Unit line
    if (trimmed && !mode && !unit && !trimmed.startsWith("#")) unit = trimmed;
  }
  return { name, unit, description: descLines.join("\n").trim(), notes, videos, tutorials, assignment, chapters };
}

// Minimal fallback if the markdown library fails to load
function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function basicMarkdown(md){
  const parts = md.split("```"); let html = "";
  parts.forEach((p, i) => {
    if (i % 2 === 1) { const nl = p.indexOf("\n"); const code = nl >= 0 ? p.slice(nl + 1) : p; html += "<pre><code>" + escapeHtml(code) + "</code></pre>"; }
    else { p.split(/\n{2,}/).forEach(par => { const t = par.trim(); if (!t) return;
      if (/^#{1,4}\s/.test(t)) { const lvl = t.match(/^#+/)[0].length; html += "<h" + lvl + ">" + escapeHtml(t.replace(/^#+\s/, "")) + "</h" + lvl + ">"; }
      else html += "<p>" + escapeHtml(t).replace(/\n/g, "<br>") + "</p>"; }); }
  });
  return html;
}
function renderMarkdown(md){
  if (window.marked && typeof window.marked.parse === "function") return window.marked.parse(md);
  return basicMarkdown(md);
}

function linkList(items, cls) {
  if (!items.length) return '<div class="empty">Coming soon…</div>';
  return items.map(x => `
    <a class="link-row ${cls}" href="${x.url}" ${x.url.startsWith("http") ? 'target="_blank" rel="noopener"' : ""}>
      <span class="lbl">${x.label}</span><span class="arw">↗</span>
    </a>`).join("");
}
function notesCard(t){ return `<div class="res notes"><div class="res-head"><span class="res-ic">${IC.notes}</span> Notes</div>${linkList(t.notes,"notes")}</div>`; }
function videosCard(t){ return `<div class="res videos"><div class="res-head"><span class="res-ic">${IC.videos}</span> Lecture</div>${linkList(t.videos,"videos")}</div>`; }
function tutorialCard(t){ return `<div class="res tutorial"><div class="res-head"><span class="res-ic">${IC.tutorial}</span> Tutorial</div>${linkList(t.tutorials,"tutorial")}</div>`; }
function codeCard(){
  return `<div class="res code"><div class="res-head"><span class="res-ic">${IC.code}</span> Run Your Code</div><div class="code-links">` +
    COMPILERS.map(c => `<a href="${c.url}" target="_blank" rel="noopener"><span>${c.label}</span><span class="tag">${c.tag}</span></a>`).join("") +
    `</div></div>`;
}
function assignList(items){
  if(!items.length) return '<div class="empty">Coming soon…</div>';
  return items.map(x => `
    <a class="link-row assign" href="${x.url}" ${x.url.startsWith("http") ? 'target="_blank" rel="noopener"' : ""}>
      <span class="lbl">${x.label}</span><span class="arw">↗</span>
    </a>`).join("");
}
function assignCard(t){
  return `<div class="res assign"><div class="res-head"><span class="res-ic">${IC.assign}</span> Assignment</div>${assignList(t.assignment)}</div>`;
}
function chaptersCard(t){
  if(!t.chapters || !t.chapters.length) return "";
  const rows = t.chapters.map(c => `
    <a class="chapter-row" href="topic.html?t=${encodeURIComponent(c.id)}">
      <span class="lbl">${c.label}</span><span class="arw">→</span>
    </a>`).join("");
  return `<div class="chapters-card">
    <div class="res-head"><span class="res-ic" style="background:#f0ecfe">${IC.book}</span> Chapters in this topic</div>
    <div class="chapter-grid">${rows}</div>
  </div>`;
}

function render(t) {
  const disp = n.replace(/-/g, ".");
  document.title = `${disp}. ${t.name} · PSP`;
  document.getElementById("crumb").textContent = `// PSP · Topic ${disp}`;
  document.getElementById("big-num").textContent = disp;
  document.getElementById("topic-name").textContent = t.name || `Topic ${disp}`;
  document.getElementById("topic-unit").textContent = t.unit || "";

  const hasDesc = t.description && t.description.length > 0;
  const hasChapters = t.chapters && t.chapters.length > 0;

  const descCardFull = hasDesc ? `
    <div class="desc-card" style="margin-bottom:22px">
      <div class="desc-head"><span class="res-ic">${IC.desc}</span> Description</div>
      <div class="desc-body">${renderMarkdown(t.description)}</div>
    </div>` : "";

  if (hasChapters) {
    // HUB PAGE: optional description + the list of chapters (no resource cards)
    document.getElementById("content").innerHTML = descCardFull + chaptersCard(t);
  } else {
    // CONTENT PAGE: description on the left, resources on the right
    const resStack = notesCard(t) + videosCard(t) + tutorialCard(t) + codeCard() + assignCard(t);
    const descCol = hasDesc ? `<div class="col-desc">${descCardFull}</div>` : "";
    document.getElementById("content").innerHTML = `
      <div class="layout ${hasDesc ? "has-desc" : "no-desc"}">
        ${descCol}
        <div class="col-res">${resStack}</div>
      </div>`;
  }
}

// Back link:  sub-pages go back to their parent, top pages go to All Topics
function setBackLink() {
  const back = document.querySelector(".back-link");
  if (!back) return;
  if (n.includes("-")) {
    const parent = n.substring(0, n.lastIndexOf("-"));
    back.href = "topic.html?t=" + encodeURIComponent(parent);
    back.textContent = "← Back";
  } else {
    back.href = "index.html#topics";
    back.textContent = "← All Topics";
  }
}
setBackLink();

async function load() {
  try {
    const res = await fetch(`topics/${n}.md`, { cache: "no-store" });
    if (!res.ok) throw 0;
    render(parseTopic(await res.text()));
  } catch (e) {
    document.getElementById("topic-name").textContent = `Topic ${n}`;
    document.getElementById("content").innerHTML =
      `<div class="state"><h2>Content not found</h2><p>The file <code>topics/${n}.md</code> could not be loaded yet.</p></div>`;
  }
}
load();
</script>
</body>
</html>
