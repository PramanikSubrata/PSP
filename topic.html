<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Topic · Problem Solving with Programming (PSP)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:#16132e; --muted:#6a6a86; --bg:#f8f8fd; --card:#fff; --line:#e8e6f4;
    --brand:#6d28d9; --brand-2:#06b6d4;
    --notes:#2563eb; --notes-bg:#eff5ff;
    --videos:#db2777; --videos-bg:#fdf0f7;
    --code:#059669; --code-bg:#ecfaf4;
    --assign:#d97706; --assign-bg:#fff6ea;
    --radius:16px; --shadow:0 10px 30px -12px rgba(45,27,105,.18);
    --font-display:"Space Grotesk",sans-serif; --font-body:"Inter",sans-serif; --font-mono:"JetBrains Mono",monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body { font-family:var(--font-body); color:var(--ink); background:var(--bg); line-height:1.6; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  .wrap { max-width:1080px; margin:0 auto; padding:0 22px; }

  /* Nav */
  .nav { position:sticky; top:0; z-index:50; background:rgba(248,248,253,.85); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  .nav-inner { display:flex; align-items:center; justify-content:space-between; height:62px; }
  .brand-mark { display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:18px; }
  .brand-badge { width:34px; height:34px; border-radius:9px; display:grid; place-items:center; background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; font-family:var(--font-mono); font-weight:600; font-size:15px; box-shadow:0 6px 16px -6px rgba(109,40,217,.6); }
  .brand-word { font-family:var(--font-display); font-weight:700; letter-spacing:.06em; background:linear-gradient(100deg,var(--brand),var(--brand-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .back-link { display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:14px; color:var(--brand); padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:#fff; transition:.18s; }
  .back-link:hover { background:#f0ecfe; transform:translateX(-2px); }

  /* Topic header */
  .topic-hero { background:radial-gradient(700px 300px at 90% -20%, rgba(109,40,217,.28), transparent 60%), #12102c; color:#fff; padding:46px 0 52px; }
  .crumb { font-family:var(--font-mono); font-size:12.5px; color:#c9b8ff; letter-spacing:.04em; }
  .topic-hero h1 { font-family:var(--font-display); font-weight:700; font-size:clamp(28px,4.5vw,42px); letter-spacing:-.02em; margin-top:14px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .big-num { width:54px; height:54px; border-radius:14px; display:grid; place-items:center; font-size:24px; background:linear-gradient(135deg,var(--brand),var(--brand-2)); flex:none; }
  .topic-unit { display:inline-block; margin-top:14px; font-family:var(--font-mono); font-size:13px; color:#cfcbe8; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); padding:6px 13px; border-radius:999px; }

  /* Content */
  main { padding:44px 0 70px; }
  .res-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:640px){ .res-grid{ grid-template-columns:1fr; } }
  .res { border:1px solid var(--line); border-radius:13px; padding:16px 17px; background:#fff; box-shadow:0 4px 16px -12px rgba(45,27,105,.2); }
  .res-head { display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-weight:600; font-size:15px; margin-bottom:13px; }
  .res-ic { width:28px; height:28px; border-radius:8px; display:grid; place-items:center; flex:none; }
  .res.notes { border-top:3px solid var(--notes); } .res.notes .res-ic { background:var(--notes-bg); }
  .res.videos { border-top:3px solid var(--videos); } .res.videos .res-ic { background:var(--videos-bg); }
  .res.code { border-top:3px solid var(--code); } .res.code .res-ic { background:var(--code-bg); }
  .res.assign { border-top:3px solid var(--assign); } .res.assign .res-ic { background:var(--assign-bg); }

  .link-row { display:flex; align-items:center; gap:9px; padding:10px 12px; border-radius:9px; font-size:14px; font-weight:500; transition:.15s; margin-bottom:7px; background:#faf9ff; border:1px solid transparent; }
  .link-row:last-child { margin-bottom:0; }
  .link-row .lbl { flex:1; }
  .link-row .arw { color:var(--muted); font-size:12px; }
  .link-row.notes:hover { background:var(--notes-bg); border-color:#d7e6ff; transform:translateX(3px); }
  .link-row.videos:hover { background:var(--videos-bg); border-color:#f7d6e8; transform:translateX(3px); }
  .empty { color:var(--muted); font-size:13.5px; font-style:italic; padding:6px 2px; }

  .code-links a { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 13px; border-radius:10px; margin-bottom:8px; font-weight:600; font-size:14px; color:#065f46; background:var(--code-bg); border:1px solid #cdeee0; transition:.15s; }
  .code-links a:last-child { margin-bottom:0; }
  .code-links a:hover { background:#059669; color:#fff; }
  .code-links a .tag { font-family:var(--font-mono); font-size:11px; font-weight:500; opacity:.8; }

  .assign-box { display:flex; flex-direction:column; gap:12px; }
  .deadline { display:inline-flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:13px; color:#92400e; background:var(--assign-bg); padding:8px 12px; border-radius:9px; border:1px solid #fde3c0; width:fit-content; }
  .assign-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--assign); color:#fff; font-weight:600; font-size:14px; padding:11px 16px; border-radius:10px; transition:.15s; }
  .assign-btn:hover { background:#b45309; }

  .state { text-align:center; padding:60px 20px; color:var(--muted); }
  .state h2 { font-family:var(--font-display); color:var(--ink); margin-bottom:8px; }

  footer { background:#12102c; color:#cfcbe8; padding:40px 0; text-align:center; }
  footer .fnote { font-family:var(--font-mono); font-size:13px; color:#8a86ad; margin-top:8px; }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;scroll-behavior:auto;} }
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap nav-inner">
    <a class="brand-mark" href="index.html"><span class="brand-badge">&lt;/&gt;</span> <span class="brand-word">PSP</span></a>
    <a class="back-link" href="index.html#topics">← All Topics</a>
  </div>
</nav>

<header class="topic-hero">
  <div class="wrap">
    <div class="crumb" id="crumb">// PSP · Topic</div>
    <h1><span class="big-num" id="big-num">–</span><span id="topic-name">Loading…</span></h1>
    <span class="topic-unit" id="topic-unit"></span>
  </div>
</header>

<main>
  <div class="wrap" id="content">
    <div class="state"><h2>Loading topic…</h2><p>Please wait a moment.</p></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div style="font-family:var(--font-display);font-weight:600;font-size:16px;">Problem Solving with Programming (PSP)</div>
    <div class="fnote">Maintained by Teaching Assistant Team (IIITA)</div>
  </div>
</footer>

<script>
// 5 compilers — same for every topic
const COMPILERS = [
  { label: "OnlineGDB",     url: "https://www.onlinegdb.com/online_c_compiler", tag: "Write & run instantly" },
  { label: "CodeChef",      url: "https://www.codechef.com/practice/c",         tag: "Practice ladder" },
  { label: "HackerRank",    url: "https://www.hackerrank.com/domains/c",        tag: "Structured problems" },
  { label: "VS Code (Web)", url: "https://visual-studio-code-three.vercel.app/", tag: "Full editor in browser" },
  { label: "LeetCode (C)",  url: "https://leetcode.com/problemset/?search=c",    tag: "Interview-style problems" }
];

const IC = {
  notes:  '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h6"/></svg>',
  videos: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#db2777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="10 8 16 12 10 16 10 8"/><rect x="2" y="4" width="20" height="16" rx="3"/></svg>',
  code:   '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>',
  assign: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  clock:  '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#92400e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
};

// Read ?t=N
const params = new URLSearchParams(location.search);
let n = parseInt(params.get("t"), 10);
if (!n || n < 1 || n > 15) n = 1;

// Parse one topic subfile
function parseTopic(md) {
  const lines = md.split(/\r?\n/);
  let name = "", unit = "", mode = null, inCode = false, inComment = false;
  const notes = [], videos = [];
  let assignment = { deadline: "TBA", url: "#" };
  for (const raw of lines) {
    const line = raw.trim();
    if (line.startsWith("<!--")) inComment = true;
    if (inComment) { if (line.includes("-->")) inComment = false; continue; }
    if (line.startsWith("```")) { inCode = !inCode; continue; }
    if (inCode) continue;
    if (line.startsWith("# ")) { name = line.slice(2).trim(); continue; }
    if (line.startsWith("## ")) {
      const h = line.slice(3).toLowerCase();
      mode = h.startsWith("note") ? "notes" : h.startsWith("video") ? "videos" : h.startsWith("assign") ? "assignment" : null;
      continue;
    }
    if (line.startsWith("- ") && mode) {
      const item = line.slice(2);
      const i = item.lastIndexOf("|");
      const label = (i >= 0 ? item.slice(0, i) : item).trim();
      const url = (i >= 0 ? item.slice(i + 1) : "#").trim() || "#";
      if (mode === "assignment") assignment = { deadline: label || "TBA", url };
      else (mode === "notes" ? notes : videos).push({ label, url });
      continue;
    }
    if (line && !mode && !unit && !line.startsWith("#")) unit = line;
  }
  return { name, unit, notes, videos, assignment };
}

function linkList(items, cls) {
  if (!items.length) return '<div class="empty">Coming soon…</div>';
  return items.map(x => `
    <a class="link-row ${cls}" href="${x.url}" ${x.url.startsWith("http") ? 'target="_blank" rel="noopener"' : ""}>
      <span class="lbl">${x.label}</span><span class="arw">↗</span>
    </a>`).join("");
}
function compilerList() {
  return '<div class="code-links">' + COMPILERS.map(c => `
    <a href="${c.url}" target="_blank" rel="noopener"><span>${c.label}</span><span class="tag">${c.tag}</span></a>`).join("") + '</div>';
}

function render(t) {
  document.title = `${n}. ${t.name} · PSP`;
  document.getElementById("crumb").textContent = `// PSP · Topic ${n} of 15`;
  document.getElementById("big-num").textContent = n;
  document.getElementById("topic-name").textContent = t.name || `Topic ${n}`;
  document.getElementById("topic-unit").textContent = t.unit || "";
  document.getElementById("content").innerHTML = `
    <div class="res-grid">
      <div class="res notes">
        <div class="res-head"><span class="res-ic">${IC.notes}</span> Notes</div>
        ${linkList(t.notes, "notes")}
      </div>
      <div class="res videos">
        <div class="res-head"><span class="res-ic">${IC.videos}</span> Video Lectures</div>
        ${linkList(t.videos, "videos")}
      </div>
      <div class="res code">
        <div class="res-head"><span class="res-ic">${IC.code}</span> Run Your Code</div>
        ${compilerList()}
      </div>
      <div class="res assign">
        <div class="res-head"><span class="res-ic">${IC.assign}</span> Assignment</div>
        <div class="assign-box">
          <span class="deadline">${IC.clock} Deadline: ${t.assignment.deadline}</span>
          <a class="assign-btn" href="${t.assignment.url}" ${t.assignment.url.startsWith("http") ? 'target="_blank" rel="noopener"' : ""}>Open assignment ↗</a>
        </div>
      </div>
    </div>`;
}

async function load() {
  try {
    const res = await fetch(`topics/${n}.md`, { cache: "no-store" });
    if (!res.ok) throw 0;
    render(parseTopic(await res.text()));
  } catch (e) {
    document.getElementById("topic-name").textContent = `Topic ${n}`;
    document.getElementById("content").innerHTML =
      `<div class="state"><h2>Content not found</h2><p>The file <code>topics/${n}.md</code> could not be loaded yet.</p></div>`;
  }
}
load();
</script>
</body>
</html>
